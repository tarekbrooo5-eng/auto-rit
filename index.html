<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مفرغ الفيديو الذكي - CapCut Style</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 500px; background: #1e293b; padding: 24px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        h1 { font-size: 1.5rem; text-align: center; margin-bottom: 20px; color: #38bdf8; }
        .upload-box { border: 2px dashed #475569; padding: 30px; text-align: center; border-radius: 12px; cursor: pointer; transition: 0.3s; margin-bottom: 20px; background: #0f172a; display: block; }
        .upload-box:hover { border-color: #38bdf8; }
        input[type="file"] { display: none; }
        .btn { background: #0284c7; color: white; border: none; padding: 12px 20px; width: 100%; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn:hover { background: #0369a1; }
        .btn:disabled { background: #64748b; cursor: not-allowed; }
        .loading { display: none; text-align: center; margin: 20px 0; color: #fbbf24; font-weight: bold; }
        .results { margin-top: 20px; background: #0f172a; padding: 15px; border-radius: 8px; max-height: 350px; overflow-y: auto; border: 1px solid #334155; }
        .segment { padding: 10px 0; border-bottom: 1px solid #1e293b; font-size: 1rem; line-height: 1.6; }
        .time { color: #38bdf8; font-size: 0.85rem; margin-left: 8px; font-family: monospace; }
    </style>
</head>
<body>

    <div class="container">
        <h1>مفرغ الفيديو الذكي</h1>
        
        <label class="upload-box" for="mediaFile">
            <p>اختر ملف فيديو أو صوت من هاتفك</p>
            <span id="fileName" style="color: #94a3b8; font-size: 0.85rem; display: block; margin-top: 8px;">لم يتم اختيار ملف</span>
        </label>
        <input type="file" id="mediaFile" accept="video/*,audio/*">

        <button class="btn" id="uploadBtn" disabled>ابدأ التفريغ الصوتي</button>

        <div class="loading" id="loadingText">جاري استخراج الصوت ومعالجته بالذكاء الاصطناعي... قد يستغرق الأمر دقيقة في المرة الأولى.</div>

        <div class="results" id="resultsBox" style="display: none;">
            <h3 style="font-size: 1rem; margin-bottom: 10px; color: #38bdf8;">النصوص المستخرجة مع التوقيتات:</h3>
            <div id="transcriptContent"></div>
        </div>
    </div>

    <script>
        // رابط سيرفرك الرسمي المباشر على Render
        const API_URL = "https://fb-agent-server-1.onrender.com/transcribe";

        const fileInput = document.getElementById("mediaFile");
        const fileNameSpan = document.getElementById("fileName");
        const uploadBtn = document.getElementById("uploadBtn");
        const loadingText = document.getElementById("loadingText");
        const resultsBox = document.getElementById("resultsBox");
        const transcriptContent = document.getElementById("transcriptContent");

        let selectedFile = null;

        fileInput.addEventListener("change", (e) => {
            selectedFile = e.target.files[0];
            if (selectedFile) {
                fileNameSpan.textContent = selectedFile.name;
                uploadBtn.disabled = false;
            } else {
                fileNameSpan.textContent = "لم يتم اختيار ملف";
                uploadBtn.disabled = true;
            }
        });

        uploadBtn.addEventListener("click", async () => {
            if (!selectedFile) return;

            const formData = new FormData();
            formData.append("file", selectedFile);

            uploadBtn.disabled = true;
            loadingText.style.display = "block";
            resultsBox.style.display = "none";
            transcriptContent.innerHTML = "";

            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    body: formData
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    resultsBox.style.display = "block";
                    if (result.segments && result.segments.length > 0) {
                        result.segments.forEach(seg => {
                            const div = document.createElement("div");
                            div.className = "segment";
                            div.innerHTML = `<span class="time">[${seg.start}s - ${seg.end}s]</span> ${seg.text}`;
                            transcriptContent.appendChild(div);
                        });
                    } else {
                        transcriptContent.innerHTML = "<p>تمت المعالجة ولكن لم يتم العثور على كلمات واضحة.</p>";
                    }
                } else {
                    alert("خطأ من السيرفر: " + (result.error || "حدث خطأ غير معروف"));
                }

            } catch (error) {
                console.error(error);
                alert("فشل الاتصال بالسيرفر. تذكر أن الباقة المجانية على Render قد تأخذ حوالي 50 ثانية للاستيقاظ في أول طلب.");
            } finally {
                uploadBtn.disabled = false;
                loadingText.style.display = "none";
            }
        });
    </script>
</body>
</html>
